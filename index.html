<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rustic Garden — AI Service Orchestrator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif}
#app{position:relative;width:100%;height:100%}
canvas#globe{display:block;width:100%;height:100%;cursor:grab}
canvas#globe:active{cursor:grabbing}
#sidebar{position:absolute;top:0;right:0;width:420px;height:100%;background:rgba(15,15,20,0.92);backdrop-filter:blur(12px);border-left:1px solid rgba(139,69,19,0.3);overflow-y:auto;z-index:10;transition:transform 0.3s}
#sidebar.collapsed{transform:translateX(100%)}
#sidebar-toggle{position:absolute;top:16px;right:430px;z-index:11;width:36px;height:36px;background:rgba(15,15,20,0.85);border:1px solid rgba(139,69,19,0.5);color:#deb887;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
#sidebar-toggle:hover{background:rgba(139,69,19,0.3)}
.side-header{padding:16px;border-bottom:1px solid rgba(139,69,19,0.2);text-align:center}
.side-header h2{font-size:15px;color:#deb887;letter-spacing:2px;font-weight:600}
.side-header small{color:#888;font-size:11px;display:block;margin-top:4px}
.console-panel{padding:0 16px 16px;flex:1;display:flex;flex-direction:column;height:calc(100% - 120px)}
.console-label{color:#8B4513;font-size:11px;letter-spacing:1px;margin:12px 0 6px;font-weight:600}
#log{flex:1;background:rgba(0,0,0,0.5);border:1px solid rgba(139,69,19,0.2);border-radius:10px;padding:12px;font-family:'Roboto Mono',monospace;font-size:11.5px;line-height:1.7;overflow-y:auto;white-space:pre-wrap;color:#a8a8a8}
#log .t{color:#666}
#log .info{color:#deb887}
#log .ok{color:#6fcf6f}
#log .err{color:#e74c3c}
#log .route{color:#5dade2}
#stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px;margin-top:8px}
.stat{background:rgba(139,69,19,0.12);border:1px solid rgba(139,69,19,0.2);border-radius:8px;padding:8px;text-align:center}
.stat .val{font-size:18px;font-weight:700;color:#deb887}
.stat .lbl{font-size:9px;color:#888;letter-spacing:1px;margin-top:2px}
#crates-info{position:absolute;bottom:16px;left:16px;background:rgba(15,15,20,0.85);backdrop-filter:blur(8px);border:1px solid rgba(139,69,19,0.3);border-radius:10px;padding:10px 14px;z-index:10;font-size:11px;color:#aaa}
#crates-info strong{color:#deb887}
.hero-title{position:absolute;top:20px;left:20px;z-index:10;font-size:22px;font-weight:700;color:#deb887;letter-spacing:3px;text-shadow:0 2px 20px rgba(0,0,0,0.8)}
.hero-title span{display:block;font-size:11px;color:#888;letter-spacing:1px;margin-top:4px;font-weight:400}
.crate-label{position:absolute;pointer-events:none;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.8);white-space:nowrap}
#tooltip{position:absolute;display:none;background:rgba(15,15,20,0.95);border:1px solid rgba(139,69,19,0.5);border-radius:8px;padding:10px 14px;z-index:20;pointer-events:none;font-size:12px;max-width:260px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
#tooltip h4{color:#deb887;margin-bottom:4px;font-size:13px}
#tooltip p{color:#aaa;line-height:1.5}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,69,19,0.3);border-radius:4px}
@media(max-width:700px){#sidebar{width:100%}#sidebar-toggle{right:10px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="globe"></canvas>
  <div class="hero-title">RUSTIC GARDEN<span>21 AI Services &middot; Live Orchestration</span></div>
  <div id="crates-info"><strong>25</strong> AI nodes &middot; Drag to orbit &middot; Scroll to zoom &middot; Click a crate to route</div>
  <div id="tooltip"><h4></h4><p></p></div>
  <button id="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">&#9776;</button>
  <div id="sidebar">
    <div class="side-header">
      <h2>CONSOLE</h2>
      <small>Service Router &amp; Gateway</small>
    </div>
    <div id="stats-row">
      <div class="stat"><div class="val" id="s-active">0</div><div class="lbl">ACTIVE</div></div>
      <div class="stat"><div class="val" id="s-routed">0</div><div class="lbl">ROUTED</div></div>
      <div class="stat"><div class="val" id="s-ok">0</div><div class="lbl">HEALTHY</div></div>
    </div>
    <div class="console-panel">
      <div class="console-label">SERVICE LOG</div>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('globe'),ctx=canvas.getContext('2d');
const log=document.getElementById('log');
const tooltip=document.getElementById('tooltip');
const GRID=5,SPACING=52;
const services=['assistant','autotask','translator','summarizer','coder','reviewer','vision','audio','embed','rank','plan','search','reasoner','memory','agent','planner','critic','writer','analyst','scheduler','monitor'];
let W,H,camX=0,camY=-40,camZ=220,rotY=0.45,rotX=-0.25;
let dragging=false,lastMX=0,lastMY=0,hoverIdx=-1,activeIdx=-1;
let routeAnim=[],crates=[];
function init(){resize();buildCrates();logSystem();draw();requestAnimationFrame(tick)}
function resize(){W=canvas.width=canvas.offsetWidth*devicePixelRatio;H=canvas.height=canvas.offsetHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);W/=devicePixelRatio;H/=devicePixelRatio}
window.addEventListener('resize',()=>{resize()});
function buildCrates(){crates=[];let id=0;for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){let x=(i-GRID/2+0.5)*SPACING,z=(j-GRID/2+0.5)*SPACING;let svc=services[id%services.length];crates.push({id,service:svc,label:`AI #${id+1}`,x,y:0,z,sel:false,hue:20+Math.random()*20,clickT:0});id++}}
const COS=Math.cos,SIN=Math.sin;
function project(x,y,z){
  let ry=rotY,rx=rotX;
  let x1=x*COS(ry)-z*SIN(ry),z1=x*SIN(ry)+z*COS(ry);
  let y1=y*COS(rx)-z1*SIN(rx),z2=y*SIN(rx)+z1*COS(rx);
  z2+=camZ;if(z2<1)return null;
  let scale=300/z2;
  return{x:x1*scale+W/2,y:y1*scale+H/2,z:z2,scale};
}
function tick(){requestAnimationFrame(tick)}
let frame=0;
function draw(){requestAnimationFrame(draw);frame++;ctx.clearRect(0,0,W,H);
  // rustic ground plane (screen-space horizon)
  ctx.save();
  let gx0=W/2,gy0=H*0.74,grx=Math.max(W,1300)*0.55,gry=grx*0.34;
  let gg=ctx.createRadialGradient(gx0,gy0,10,gx0,gy0,grx);
  gg.addColorStop(0,'#2a1506');gg.addColorStop(0.55,'#1b1004');gg.addColorStop(1,'rgba(10,8,6,0)');
  ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(gx0,gy0,grx,gry,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.5;ctx.strokeStyle='rgba(139,69,19,0.55)';
  for(let row=0;row<7;row++){
    let yy=gy0-12- row*row*5;
    ctx.beginPath();ctx.ellipse(gx0,yy,grx-row*row*8,Math.max(2,gry-row*row*2.4),0,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=0.15;ctx.strokeStyle='#deb887';
  for(let s=0;s<13;s++){ctx.beginPath();ctx.moveTo(gx0,gy0);ctx.lineTo(gx0+Math.cos(s/12*Math.PI*2)*grx*0.3,gy0-Math.sin(s/12*Math.PI*2)*grx*0.3);ctx.stroke()}
  ctx.restore();
  // crates
  let projected=crates.map((c,i)=>{
    let p=project(c.x,c.y,c.z);return{...c,i,p};
  }).filter(c=>c.p);
  projected.sort((a,b)=>b.p.z-a.p.z);
  for(let c of projected){
    let{p,i}=c,pw=16*p.scale,ph=12*p.scale;
    let isHover=i===hoverIdx,isSel=i===activeIdx;
    ctx.save();
    ctx.globalAlpha=0.85;
    let grad=ctx.createLinearGradient(p.x,p.y-ph,p.x,p.y+ph);
    grad.addColorStop(0,isSel?'#f0c040':isHover?'#c9956a':'#DEB887');
    grad.addColorStop(1,isSel?'#8B4513':'#6b3410');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(p.x-pw/2,p.y-ph,pw,ph,3*p.scale);ctx.fill();
    ctx.strokeStyle=isSel?'#f0c040':'rgba(139,69,19,0.5)';ctx.lineWidth=isHover?2:1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`${Math.max(7,9*c.scale)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.label,p.x,p.y-ph/2);
    // glow ring
    if(isSel||isHover){ctx.globalAlpha=0.3+0.1*Math.sin(frame*0.06);ctx.beginPath();ctx.arc(p.x,p.y-ph/2,pw*0.9,0,Math.PI*2);ctx.strokeStyle=isSel?'#f0c040':'#DEB887';ctx.lineWidth=2;ctx.stroke()}
    ctx.restore();
    c.screenP=p;c.screenPW=pw;c.screenPH=ph;
  }
  // route lines
  ctx.save();ctx.globalAlpha=0.6;
  for(let r of routeAnim){
    let age=Date.now()-r.t;if(age>1500){r.done=true;continue}
    let prog=age/1500;
    let sx=W/2,sy=H/2;
    let ex=r.tp.x+Math.cos(frame*0.03+r.i)*3,ey=r.tp.y+r.tp.scale*6;
    let mx=(sx+ex)/2+Math.sin(prog*Math.PI)*30,my=(sy+ey)/2-Math.abs(Math.sin(prog*Math.PI))*40;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(mx,my,sx+(ex-sx)*prog,sy+(ey-sy)*prog);
    ctx.strokeStyle=r.ok?'#6fcf6f':'#e74c3c';ctx.lineWidth=2;ctx.stroke();
    // moving dot
    let t=prog,px=sx*(1-t)*(1-t)+mx*2*t*(1-t)+ex*t*t,py=sy*(1-t)*(1-t)+my*2*t*(1-t)+ey*t*t;
    ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle=r.ok?'#6fcf6f':'#e74c3c';ctx.fill();
  }
  ctx.restore();
  routeAnim=routeAnim.filter(r=>!r.done);
  // active stats
  let now=Date.now();let active=routeAnim.filter(r=>now-r.t<1500).length;
  document.getElementById('s-active').textContent=active;
}
canvas.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY});
canvas.addEventListener('mousemove',e=>{
  if(dragging){rotY+=(e.clientX-lastMX)*0.008;rotX+=(e.clientY-lastMY)*0.008;rotX=Math.max(-0.8,Math.min(0.5,rotX));lastMX=e.clientX;lastMY=e.clientY;return}
  let mx=e.clientX,my=e.clientY;hoverIdx=-1;
  for(let i=crates.length-1;i>=0;i--){let c=crates[i];if(!c.screenP)continue;let p=c.screenP,pw=c.screenPW,ph=c.screenPH;if(mx>p.x-pw/2&&mx<p.x+pw/2&&my>p.y-ph&&my<p.y){hoverIdx=i;break}}
  if(hoverIdx>=0){let c=crates[hoverIdx];tooltip.style.display='block';tooltip.querySelector('h4').textContent=c.label;tooltip.querySelector('p').textContent=`Service: ${c.service} · Status: Ready`;tooltip.style.left=Math.min(mx+14,innerWidth-280)+'px';tooltip.style.top=(my-40)+'px';canvas.style.cursor='pointer'}
  else{tooltip.style.display='none';canvas.style.cursor=dragging?'grabbing':'grab'}
});
canvas.addEventListener('mouseup',e=>{if(dragging){dragging=false;if(Math.abs(e.clientX-lastMX)+Math.abs(e.clientY-lastMY)<4)routeToCrate(hoverIdx)}});
canvas.addEventListener('mouseleave',()=>{hoverIdx=-1;tooltip.style.display='none'});
canvas.addEventListener('wheel',e=>{camZ+=e.deltaY*0.15;camZ=Math.max(80,Math.min(500,camZ))});
let routeCount=0,routedSet=new Set();
function routeToCrate(idx){
  if(idx<0)return;
  let c=crates[idx];activeIdx=idx;c.clickT=Date.now();
  let ok=Math.random()>0.08;routeCount++;
  routedSet.add(idx);
  document.getElementById('s-routed').textContent=routeCount;
  document.getElementById('s-ok').textContent=routedSet.size;
  let tp=c.screenP||project(c.x,c.y,c.z);
  routeAnim.push({i:idx,tp,ok,t:Date.now(),done:false});
  let ts=()=>new Date().toISOString().slice(11,23);
  addLog('info',`[${ts()}] → ROUTE → AI #${idx+1} (${c.service})`);
  setTimeout(()=>{if(ok)addLog('ok',`[${ts()}] ✓ 200 OK — ${c.service} responded (${Math.floor(Math.random()*180+20)}ms)`);else addLog('err',`[${ts()}] ✗ 503 — ${c.service} overloaded — retrying...`)},300+Math.random()*400);
  setTimeout(()=>activeIdx=-1,1500);
}
function addLog(cls,msg){let d=document.createElement('div');d.className=cls;d.textContent=msg;log.appendChild(d);log.scrollTop=log.scrollHeight}
function logSystem(){
  addLog('t','── Rustic Garden Orchestrator ──');
  addLog('info','Gateway running at localhost:5000');
  addLog('info','Prefect orchestrator connected');
  addLog('ok','All 21 services online');
  addLog('route','Awaiting queries… Click a crate to route');
}
init();
</script>
</body>
</html>
